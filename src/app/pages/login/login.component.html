<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="emailOrUsername">Email or Username</label>
          <input 
            id="emailOrUsername"
            type="text" 
            formControlName="emailOrUsername"
            placeholder="Enter your email or username"
            class="form-input"
          >
          <div class="form-error" *ngIf="loginForm.get('emailOrUsername')?.invalid && loginForm.get('emailOrUsername')?.touched">
            Email or username is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            id="password"
            type="password" 
            formControlName="password"
            placeholder="Enter your password"
            class="form-input"
          >
          <div class="form-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required
          </div>
        </div>
        
        <div class="form-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
        
        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="submit-btn">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>
      </form>
      
      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
        <p class="demo-info">Demo: email: <strong>demo@drinkshop.com</strong>, password: <strong>demo123</strong></p>
      </div>
    </div>
  </div>
</div>
