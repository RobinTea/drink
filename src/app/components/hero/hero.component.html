<section class="hero">
  <div class="hero-background"></div>
  
  <div class="hero-content">
    <h1 class="hero-title">Refresh Your Day</h1>
    <p class="hero-subtitle">Discover the perfect drink for every moment</p>
  </div>
  
  <div class="hero-drink" [ngStyle]="getParallaxStyle()">
    <div class="drink-image">
      <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
  </div>
</section>
